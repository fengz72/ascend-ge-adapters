# Test fixture for the core framework -- NOT a model configuration.
#
# Snapshot of the authoring YAML BGE used before `models/bge` became a
# standalone, core-free model directory (`models/bge/config.yaml` no longer
# exists; `models/bge/run.sh` builds its own config).  It is kept here because
# `core.verify` / `core.data` / the GE-session runtime probes still need a real
# ONNX-source model config that points at BGE's plugin scripts:
#   * tests/test_bge_verification.py exercises core.verify.compare_business,
#     core.worker.compare_outputs and save_rows through the verification plugin;
#   * tests/test_ge_session_outputs.py uses it only as a base for generic
#     runtime probes and discards every BGE-specific reference.
# `models/bge` itself no longer reads this file.  `source.ref` is a placeholder:
# both callers load with source_paths=False (or replace it) so it is never
# opened.
model:
  name: bge
source:
  kind: onnx
  ref: models/bge/fixtures/model.onnx
target: Ascend910_9382
reference:
  device: cpu
  dtype: float32
data:
  script: models/bge/model/generate_cases.py
  directory: models/bge/io/inputs
  params:
    samples_file: models/bge/fixtures/sample_inputs.json
build:
  backend: ge_session
  dtype: float32
  options:
    precision_mode: force_fp16
    aicore_num: 12|24
verification:
  case_ids: all
  script: models/bge/model/verify.py
  params:
    expected_outputs: models/bge/fixtures/expected_outputs.json
    atol: 0.001
  outputs:
    scores:
      policy: numeric
      scope: per_sample
      cosine_min: 0.9999
      relative_l2_max: 0.001
      max_abs_error: 0.001
benchmark:
  instances: 10
  warmup: 1
  iterations: 6
  seed: 42
