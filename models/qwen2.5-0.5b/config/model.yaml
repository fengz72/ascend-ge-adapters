model:
  name: qwen2.5-0.5b
  adapter_file: models/qwen2.5-0.5b/qwen_npu_adapter.py
  params:
    score_token_ids_file: config/target_tokens.json
    prune_output: true
    max_seq_len: 2048
source:
  kind: transformers
  loader: AutoModelForCausalLM
  ref: ${QWEN_MODEL_DIR}
reference:
  device: cpu
  dtype: float32
data:
  script: models/qwen2.5-0.5b/generate_cases.py
  directory: models/qwen2.5-0.5b/io/inputs
  params:
    count: 100
    batch_size: 16
    dist: lognormal
    mu: 4.997
    sigma: 0.167
    min_len: 1
    max_len: 218
    prefix_min: 20
    prefix_max: 25
    seed: 0
build:
  backend: ge_session
  dtype: float16
  options:
    precision_mode: force_fp16
verification:
  case_ids:
    - case-0000
  outputs:
    scores:
      policy: numeric
      scope: per_sample
      cosine_min: 0.998
      relative_l2_max: 0.05
work_dir: work/qwen2.5-0.5b
benchmark:
  warmup: 10
  iterations: 1000
  seed: 42

# Platform settings apply on top of the common settings via target.family.
platforms:
  a3:
    # A3 Prefix 与 GE pass 已在 Ascend910_9382 验证；其他 A3 SoC 待实测。
    model:
      params:
        attention: prefix_910
    build:
      options:
        aicore_num: "8|16"
    benchmark:
      instances: 5
    dependencies:
      custom_ops:
        - id: prefix_attention_910
          source: third_party/custom_development_code/custom_op/prefix-attention/ascendc
          revision: 8e08d0d20275558aefac1bbb35019e6b52f1073a
          build_script: models/qwen2.5-0.5b/scripts/build_prefix_910.sh
          python_imports:
            - npu_prefix_infer_attention_score
      ge_passes:
        - id: weight_nz
          source: third_party/custom_development_code/fusion_pass/WeightNzAndMatMulV3Pass
          revision: 8e08d0d20275558aefac1bbb35019e6b52f1073a
          build_script: models/qwen2.5-0.5b/scripts/build_nz_pass.sh
  a5:
    # A5 Prefix 使用同一历史变长池；batch 由实际 case 的请求数量确定。
    model:
      params:
        attention: prefix_a5
    build:
      options:
        aicore_num: "16|32"
    benchmark:
      instances: 3
    dependencies:
      custom_ops:
        - id: prefix_attention_a5
          source: third_party/custom_development_code/custom_op/prefix-attention/cannbot-dsl/ge
          revision: 8e08d0d20275558aefac1bbb35019e6b52f1073a
          build_script: models/qwen2.5-0.5b/scripts/build_prefix_a5.sh
          python_imports:
            - prefix_attn_torch
      ge_passes:
        - id: weight_nz
          source: third_party/custom_development_code/fusion_pass/WeightNzAndMatMulV3Pass
          revision: 8e08d0d20275558aefac1bbb35019e6b52f1073a
          build_script: models/qwen2.5-0.5b/scripts/build_nz_pass.sh
