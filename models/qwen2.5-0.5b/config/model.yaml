# qwen2.5-0.5b onboarding 声明 (人工维护)
# 契约见 docs/architecture.md §5.2

model:
  name: qwen2.5-0.5b
  soc: Ascend910_9382

source:
  type: torch                      # name | torch | onnx
  ref: /export/home/models/Qwen2.5-0.5B   # 本地权重目录

adapt:
  adapter_class: Qwen25Adapter     # 同目录 model.py 里的类
  params:                          # 直接作为 adapter 构造 kwargs (= 形态开关)
    prefix: false                  # true → PIA (prefix-in-Q, npu_prefix_infer_attention_score)
    prune_token_file: null         # 填 config/target_tokens.json → lm_head 词表剪裁         # 启用 lm_head 剪裁则填 config/target_tokens.json

inputs:                            # 输入生成 (export trace 与 verify golden 共用)
  batch_size: 10
  seq_len: 208
  prefix_len: 0                    # prefix: true 时改为共享 prefix 长度 P (如 20)
  seed: 0

graph:
  format: air
  dynamic:
    max_seq_len: 2048

# 环境准备 (框架不假设构建方式, 只按序执行脚本; 脚本自己保证幂等 — 见 core/setup_scripts.py)
#   path   三方源目录: 溯源用 (一眼看出 pass/算子从哪来), 并以 $GE_SRC_DIR 传给脚本
#   script 安装脚本: 构建 + 装到 $ASCEND_HOME_PATH/opp/vendors/<各自 vendor 名>/
custom_ops:                        # 自定义算子: 在**加载 adapter 之前**执行 (model.py 会 import 绑定)
  - path: third_party/ascend-ops/prefix-attention
    script: models/qwen2.5-0.5b/scripts/install_prefix_attn.sh

passes:                            # fusion pass: 在 **ATC 编译之前**执行
  - path: third_party/custom_development_code/fusion_pass/WeightNzAndMatMulV3Pass
    script: models/qwen2.5-0.5b/scripts/install_nz_pass.sh

backend:
  type: om_acl                     # om_acl | ge_session
  aicore_num: null

# 注: 不含 device — 用哪张卡是运行期事实, 由 CLI 必填传入: ./run.sh --device 6

verify:
  enabled: true

# ---- 形态开关 (配置只描述**当前形态**; 历史形态靠 git, 见 docs §5.2) ----
# 切形态就是改下面这几行, 产物名会自动带后缀 (core.config.export_name), 不会互相覆盖:
#   FIA 基线   prefix: false + prefix_len: 0            → qwen2.5-0.5b
#   PIA prefix prefix: true  + prefix_len: 20 (>0)      → qwen2.5-0.5b-prefix
#   词表剪裁   prune_token_file: config/target_tokens.json → …-prune
# 改完记得: 要么改回, 要么提交 (报告靠 bundle.provenance 的 adapt_params 自证形态)
