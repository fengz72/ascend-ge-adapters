# qwen2.5-0.5b onboarding 声明 (人工维护)
# 契约见 docs/architecture.md §5.2

model:
  name: qwen2.5-0.5b
  # soc 已移进 platforms.<name>.soc — 平台相关事实按平台声明, 顶层写会被硬失败拒掉

source:                          # 只有 torch 一种 (来路①②同一条加载路径, 见 §2)
  ref: /export/home/models/Qwen2.5-0.5B   # 本地权重目录 (或 hub id); 来路② 客户源码未实现 (docs §10)

# ---- 平台表 (长期并存: 910_9382 与 A5 都进回归) ----
# 平台是**运行期事实** (由机器上的卡决定): 框架用 torch.npu.get_device_properties(device).name
# 去匹配各 profile 的 soc 自动选定 (--platform 可覆盖, 仅交叉编译时需要), 再把选中项摊平回
# model.soc / backend.aicore_num / custom_ops / passes — 下游不需要知道"平台"这一层。
# 键是短名 (进产物名与 provenance, 故两平台产物互不覆盖); soc 须与探测到的字符串**逐字一致**。
# 强 schema: 写未知键即硬失败 (拼错键静默忽略 = "以为限了核其实全核跑")。
# 形态开关 (prefix / prune_token_file) **不在此** — 形态是串行演进 (最终收敛到 prefix),
# 平台是长期并存, 两轴性质不同故不共用机制 (docs §5.2)。
platforms:
  ascend910_9382:
    soc: Ascend910_9382
    aicore_num: "12|24"              # om_acl → ATC --aicore_num; ge_session → GEInitialize 限核
    custom_ops:                      # 自定义算子: 在**加载 adapter 之前**执行 (model.py 会 import 绑定)
      - path: third_party/ascend-ops/prefix-attention
        script: models/qwen2.5-0.5b/scripts/install_prefix_attn.sh
    passes:                          # fusion pass: 在 **ATC 编译之前**执行
      - path: third_party/custom_development_code/fusion_pass/WeightNzAndMatMulV3Pass
        script: models/qwen2.5-0.5b/scripts/install_nz_pass.sh

  a5:
    soc: Ascend950PR_9589
    aicore_num: "16|32"                 # 待 A5 实测后填 (null = 不限核)
    custom_ops: []                   # A5 的 prefix 算子未就绪 → 阶段 1 只跑 baseline
                                     # (baseline 两平台同一个 FIA npu_fused_infer_attention_score);
                                     # 算子就绪后在此挂安装脚本, 并给 model.py 加 (A5, prefix) 分支
    passes: []                       # WeightNzAndMatMulV3Pass 是 MatMulV3 专属, A5 暂无对应 pass
    # max_seq_len: 2048              # 需要时覆盖 graph.dynamic.max_seq_len (UB/L2 尺寸随平台变)

adapt:                           # torch 源适用
  adapter_class: Qwen25Adapter   # 同目录 model.py 里的类
  params:                        # 直接作为 adapter 构造 kwargs (= 形态开关)
    prefix: false                # true → PIA (prefix-in-Q, npu_prefix_infer_attention_score)
                                 # 注: A5 上 prefix 需要该平台的新算子; 未装时 adapter 构造即硬失败
    prune_token_file: models/qwen2.5-0.5b/config/target_tokens.json   # 声明即启用 lm_head 词表剪裁

inputs:                          # 激励生成 (L0 reference / L1 golden / L2 trace+bundle 三层共用)
  # 输入由**用户脚本**生成并落盘 (<base>/io/{inputs.json, inputs/*.bin}) — 框架不生成模型
  # 专属负载 (语义自洽只有模型侧能保证: asl 必须 cumsum、position 每段从起点递增、asl[-1]==T)。
  # 落盘而非进程内造 → 激励成为三层的独立共同输入, L0/L1 golden 可脱离 export 重跑, 生成不占卡。
  script: models/qwen2.5-0.5b/scripts/gen_inputs.py
  args: []                       # 只放额外覆盖; --out/--vocab/--batch-size/--seq-len/--seed
                                 # 由框架注入, --prefix-len 的去留由 adapt.params.prefix 管辖
                                 # (core.pipeline._inputs_args), 故翻 prefix 一个开关即切形态
  batch_size: 10
  seq_len: 208
  prefix_len: 20                 # prefix: true 时改为共享 prefix 长度 P (如 20)
  seed: 0

graph:
  dynamic:
    max_seq_len: 2048            # 图常量长度 (RoPE 表 / 因果 mask); 平台可用 platforms.<n>.max_seq_len 覆盖
    # 注: 不参与 ATC 分档 — 动态图不传 --input_shape, 见 §6②

backend:
  type: ge_session               # om_acl | ge_session (平台无关; aicore_num 在 platforms 里)

# 注: 不含 device — 用哪张卡是**运行期事实** (每次运行/每台机器都可能不同),
#     由 CLI --device 必填传入 (同 --platform 的道理, 见 platforms 段)

verify:
  enabled: true
  # 四个门限不写 = 用 core/verify.py 的规范默认 (门① reference 0.999/0.02 跨实现,
  # 门② compare 0.9999/0.01 同源); 换 dtype(bf16)/更大词表/更长序列时噪声量级会变, 按需覆盖:
  # ref_cosine_min: 0.999
  # ref_rel_l2_max: 0.02
  # cmp_cosine_min: 0.9999
  # cmp_rel_l2_max: 0.01

bench:
  instances: 3                       # = 并发 worker (1:1 绑实例, 无锁)
  requests: 3000                     # 总请求 (闭环, 均分到实例)
  warmup: 50                         # 覆盖 每实例 × 每 shape 档 (GE 首次执行要特化)
  sample_seed: 0                     # 请求池**抽样**种子 (每实例 seed+instance_id); ≠ inputs.seed
  pool:
    script: models/qwen2.5-0.5b/scripts/gen_requests.py
    # --prefix 仅 adapt.params.prefix:true 时生效; false 时框架自动移除 (core.bench._form_args),
    # 故翻 prefix 一个开关即无缝切形态, 不必手改这行。范围 "20-25" 属负载口径 (每套抽一个 P)。
    args: [--count, "200", --prefix, "20-25"]
