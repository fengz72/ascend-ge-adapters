# qwen2.5-0.5b 变长负载性能测试 — 多实例 + 请求池回放
#
# 跑法 (先 ./run.sh --device N 产出 AIR/OM/manifest/bundle):
#   python3 -m core.bench --scenario models/qwen2.5-0.5b/bench/varlen.yaml --device 8
#   # 覆盖: --instances 8 --requests 4000;  只测性能: --skip-accuracy
# 产物: models/qwen2.5-0.5b/results/<run_id>/{run,perf,accuracy}.json + perf.md/accuracy.md
#       + perf_requests.csv (逐请求) ; results/index.json 汇总历次

scenario: qwen2.5-0.5b-varlen
soc: Ascend910_9382

manifest: models/qwen2.5-0.5b/deploy/manifest.json    # backend 由 manifest 决定 (om_acl / ge_session)

instances: 4          # = 并发 worker (1:1 绑实例, 无锁)
                      #   om_acl: 每实例独立 aclmdlLoadFromFile (~1.3GB HBM/实例, 实测)
                      #   ge_session: 每实例一份 AddGraph+CompileGraph (~10s/份, 串行) + LoadGraph
requests: 2000        # 总请求 (闭环, 均分到实例)
warmup: 50            # 覆盖 每实例 × 每 shape 档 (GE 首次执行要特化)
seed: 0               # 每实例 seed = seed + instance_id, 抽样可复现

inputs:
  mode: pool
  dir: models/qwen2.5-0.5b/bench/requests      # gitignored, 由下面 generate 产出

generate:                                      # 请求池生成 = 用户脚本 (语义自洽只有模型侧能保证:
  - path: tools/varlen.py                      #   asl 必须 cumsum、position 每段 0..L-1、asl[-1]==T)
    script: models/qwen2.5-0.5b/scripts/gen_requests.py
    args: [--count, "200", --dist, lognormal, --mu, "4.997", --sigma, "0.167",
           --min-len, "1", --max-len, "218", --batch, "10", --vocab, "151936", --seed, "0"]
    # 分布口径对齐旧 atb/bench_latency 的 RequestGenerator: 每请求长度 round(exp(N(μ,σ))) 截断 [1,218]

accuracy:
  enabled: true                                # 单请求跑一次 + compare_bundle (与性能跑分开)
  dtype: float16

backend_options:
  output_reserve_mb: 256                       # 池模式输出缓冲优先取 pool 内最大 golden shape
  # ge_session 专属: graph_run_mode / precision_mode / aicore_num
  # om_acl 专属: acl_config (自备 acl.json, 用于 profiling)

report:
  dir: models/qwen2.5-0.5b/results
