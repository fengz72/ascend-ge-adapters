# StartLux-Decision v1.1 0.8B Instant -- the FORMAL unified multimodal ONE-AIR config.
#
# One dynamic AIR carries the whole numerical forward: the official FP32 vision
# tower (in-graph), the official image-feature injection (masked_scatter), the
# real three-axis MRoPE and the BF16 language trunk with the F32 A_log restore
# and the independent F32 head26.  IO contract (embedded in the AIR):
#   input_ids [-1,-1] i64, position_ids [3,-1,-1] i64, actual_seq_lengths [-1] i32,
#   pixel_values [512,1536] f32 STATIC (2 global image slots),
#   image_feature_index [-1,-1] i64 -> scores [-1,26] f32.
# Graph bounds: B<=4, S<=2048, at most 2 images per call (over-limit requests
# are rejected, never truncated); officially processed 256x256 images give
# grid [1,16,16].
#
# Mixed precision (deliberate, validated):
#   vision.* FP32 (the original HF vision computes in BF16 storage; this route
#   computes the tower in FP32), text.body.* BF16, *.linear_attn.A_log restored
#   bit-exact F32 from the checkpoint, text.head_rows FP32.
#
# Encode policy (accepted): width = max(256, max true row lengths); right pad
# token 0 / position 0 / feature index -1; actual_seq_lengths keep the true
# lengths (see work/startlux-cannbot/review-p4-pad256-independent.json).
#
# source.ref reads ${STARTLUX_MODEL_DIR} (the pinned materials folder
# work/startlux-materials/model-6496ae641cc71b149ce9dad69bd97f2a44e7bf11,
# upstream commit a99977d9332decc9fb27a2488b4a83b533b6cd5f) -- export it
# before the model-reading stages (data/baseline/build); the formal scoped
# environment work/startlux-validation/p7-final/env.sh does this.
model:
  name: startlux-decision-v1.1-0.8b-instant
  adapter_file: models/startlux-decision-v1.1-0.8b-instant/unified_adapter.py
  params:
    max_seq_len: 2048
    compiled_seq_len: 256        # ALSO the accepted minimum physical width floor
    chunk_size: 64
    max_batch: 4
    fixtures_file: fixtures/p2b-readouts.json
source:
  kind: transformers
  loader: Qwen3_5ForConditionalGeneration
  ref: ${STARTLUX_MODEL_DIR}
reference:
  device: cpu
  dtype: float32
data:
  script: models/startlux-decision-v1.1-0.8b-instant/generate_unified_cases.py
  directory: work/startlux-decision/inputs
  params:
    fixtures_directory: work/startlux-decision/fixtures
build:
  backend: ge_session
  dtype: bfloat16
  options:
    graph_run_mode: 0
    precision_mode: must_keep_origin_dtype
verification:
  case_ids: all
  outputs:
    scores:
      policy: numeric
      scope: per_sample
      cosine_min: 0.999
      relative_l2_max: 0.02
  script: models/startlux-decision-v1.1-0.8b-instant/unified_verify.py
  params: {}
benchmark:
  instances: 1
  warmup: 0
  iterations: 1
  seed: 42
dependencies:
  custom_ops:
    - id: chunk_gated_delta_rule_proto
      source: models/startlux-decision-v1.1-0.8b-instant/native_proto
      revision: local-1.0.0-cann9.1.0-a3
      build_script: models/startlux-decision-v1.1-0.8b-instant/scripts/build_chunk_proto.sh
      python_imports:
        - chunk_gated_delta_rule_proto
work_dir: work/startlux-decision
