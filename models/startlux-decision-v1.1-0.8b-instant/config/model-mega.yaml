# StartLux-Decision v1.1 0.8B Instant -- the MEGA GDN route gate config.
# Same model/verification contract as config/model.yaml (the formal native
# route), with:
#   * gdn_route: mega -- the whole GDN block (conv+cache, QKV split, q/k L2
#     norm, softplus/sigmoid gates, chunk GDN, gated RMSNorm x SiLU(z)) goes
#     through the vendored MegaGdnPrefillOp via the project-built custom-op-v2
#     wrapper (softplus lives inside the op);
#   * the mega_gdn_prefill dependency (operator installed into the CANN
#     global opp by install.sh; torch binding pip-installed editable -- the
#     activator finds the .so and mounts the vendor package itself;
#     wrapper Execute derives num_matrices from cu_seqlens so B/S stay dynamic);
#   * an isolated work_dir so the validated native-route AIR and its evidence
#     are never touched.
model:
  name: startlux-decision-v1.1-0.8b-instant
  adapter_file: models/startlux-decision-v1.1-0.8b-instant/unified_adapter.py
  params:
    max_seq_len: 2048
    compiled_seq_len: 256        # ALSO the accepted minimum physical width floor
    chunk_size: 64
    max_batch: 4
    fixtures_file: fixtures/p2b-readouts.json
    gdn_route: mega
source:
  kind: transformers
  loader: Qwen3_5ForConditionalGeneration
  ref: ${STARTLUX_MODEL_DIR}
reference:
  device: cpu
  dtype: float32
data:
  script: models/startlux-decision-v1.1-0.8b-instant/generate_unified_cases.py
  directory: work/startlux-decision-mega/inputs
  params:
    fixtures_directory: work/startlux-decision/fixtures
build:
  backend: ge_session
  dtype: bfloat16
  options:
    graph_run_mode: 0
    precision_mode: must_keep_origin_dtype
verification:
  case_ids: all
  outputs:
    scores:
      policy: numeric
      scope: per_sample
      cosine_min: 0.999
      relative_l2_max: 0.02
  script: models/startlux-decision-v1.1-0.8b-instant/unified_verify.py
  params: {}
benchmark:
  instances: 1
  warmup: 0
  iterations: 1
  seed: 42
dependencies:
  custom_ops:
    - id: mega_gdn_prefill
      source: third_party/ascend-ops/mega-gdn-prefill
      revision: local-2.0.0-merged-cann9.1.0-a3
      build_script: models/startlux-decision-v1.1-0.8b-instant/scripts/build_mega_gdn.sh
      python_imports:
        - mega_gdn_prefill
work_dir: work/startlux-decision-mega
